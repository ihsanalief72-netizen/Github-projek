<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - MainBadminton</title>


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: Arial, sans-serif;
            background: #061511;
            color: white;
        }


        /* =========================================
           MAIN LOGIN PAGE
        ========================================= */

        .login-page {

            min-height: 100vh;

            width: 100%;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 30% 45%,
                    rgba(25, 75, 58, 0.45),
                    transparent 35%
                ),
                linear-gradient(
                    120deg,
                    #071914 0%,
                    #05120f 50%,
                    #061511 100%
                );

        }


        /* =========================================
           BACKGROUND CIRCLE
        ========================================= */

        .bg-circle {

            position: absolute;

            width: 580px;
            height: 580px;

            border-radius: 50%;

            background: rgba(18, 60, 47, 0.42);

            left: 8%;
            top: 15%;

            z-index: 0;

        }


        /* =========================================
           DECORATIVE CIRCLE
        ========================================= */

        .decor-circle {

            position: absolute;

            width: 700px;
            height: 700px;

            border: 2px solid rgba(201, 161, 90, 0.25);

            border-radius: 50%;

            right: -350px;
            top: -280px;

            transform: rotate(25deg);

            z-index: 0;

        }


        /* =========================================
           DECORATIVE LINE
        ========================================= */

        .decor-line {

            position: absolute;

            width: 650px;
            height: 1px;

            background: rgba(201, 161, 90, 0.35);

            right: -100px;
            top: 100px;

            transform: rotate(-40deg);

            z-index: 0;

        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .content {

            min-height: 100vh;

            width: 100%;

            display: grid;

            grid-template-columns: 1.15fr 0.85fr;

            align-items: center;

            padding: 40px 7%;

            position: relative;

            z-index: 2;

        }


        /* =========================================
           LEFT SIDE
        ========================================= */

        .visual {

            height: 100%;

            min-height: 600px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

        }


        /* =========================================
           PLAYER IMAGE
        ========================================= */

        .player {

            width: min(620px, 90%);

            position: relative;

            z-index: 3;

        }


        .player img {

            width: 100%;

            height: auto;

            display: block;

            object-fit: contain;

        }


        /* =========================================
           COURT
        ========================================= */

        .court {

            position: absolute;

            bottom: -50px;

            left: -15%;

            width: 900px;

            height: 190px;

            border-top: 2px solid rgba(255,255,255,0.55);

            transform:
                perspective(500px)
                rotateX(55deg);

            opacity: 0.5;

            z-index: 1;

        }


        .court::before {

            content: "";

            position: absolute;

            top: 45px;

            left: 0;

            width: 100%;

            border-top: 2px solid rgba(255,255,255,0.35);

        }


        .court::after {

            content: "";

            position: absolute;

            top: 90px;

            left: 0;

            width: 100%;

            border-top: 2px solid rgba(255,255,255,0.25);

        }


        /* =========================================
           LOGIN BOX
        ========================================= */

        .login-box {

            width: 100%;

            max-width: 540px;

            padding-left: 30px;

            position: relative;

            z-index: 5;

        }


        /* =========================================
           SMALL TITLE
        ========================================= */

        .small-title {

            color: #c9a15a;

            font-size: 12px;

            letter-spacing: 4px;

            font-weight: 600;

            margin-bottom: 15px;

        }


        /* =========================================
           LOGIN TITLE
        ========================================= */

        .login-title {

            font-size: 58px;

            line-height: 1;

            font-weight: 700;

            margin: 0 0 22px;

            color: #ffffff;

        }


        .login-title span {

            color: #c9a15a;

        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .description {

            color: #aeb8b5;

            font-size: 16px;

            line-height: 1.7;

            margin: 0 0 32px;

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-group {

            position: relative;

            margin-bottom: 18px;

        }


        .input-group > i {

            position: absolute;

            left: 23px;

            top: 50%;

            transform: translateY(-50%);

            color: #d5d8d7;

            font-size: 19px;

            z-index: 2;

        }


        .input-group input {

            width: 100%;

            height: 60px;

            padding: 0 55px;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.22);

            border-radius: 30px;

            outline: none;

            color: white;

            font-size: 15px;

            transition: all 0.3s ease;

        }


        .input-group input::placeholder {

            color: #929c99;

        }


        .input-group input:focus {

            border-color: #c9a15a;

            background: rgba(255,255,255,0.055);

            box-shadow:
                0 0 0 2px rgba(201,161,90,0.08);

        }


        /* =========================================
           PASSWORD TOGGLE
        ========================================= */

        .password-toggle {

            position: absolute;

            right: 22px;

            top: 50%;

            transform: translateY(-50%);

            color: #929c99;

            cursor: pointer;

            transition: 0.2s;

            z-index: 3;

        }


        .password-toggle:hover {

            color: #c9a15a;

        }


        /* =========================================
           OPTIONS
        ========================================= */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 22px 3px 30px;

            color: #b9c0be;

            font-size: 14px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 10px;

            cursor: pointer;

        }


        .remember input {

            width: 19px;

            height: 19px;

            accent-color: #c9a15a;

            cursor: pointer;

        }


        .forgot {

            color: #c9a15a;

            text-decoration: none;

            transition: 0.2s;

        }


        .forgot:hover {

            color: #dfbd7d;

            text-decoration: underline;

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 58px;

            border: none;

            border-radius: 30px;

            background: #c9a15a;

            color: #111;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.18);

        }


        .login-button:hover {

            background: #dfbd7d;

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(0,0,0,0.25);

        }


        .login-button:active {

            transform: translateY(0);

        }


        .login-button i {

            margin-left: 15px;

        }


        /* =========================================
           ERROR BOX
        ========================================= */

        .error-box {

            display: none;

            padding: 12px 15px;

            margin-bottom: 18px;

            border-radius: 10px;

            background: rgba(220, 38, 38, 0.15);

            border: 1px solid rgba(220, 38, 38, 0.4);

            color: #ffb4b4;

            font-size: 13px;

        }


        .error-box.show {

            display: block;

        }


        /* =========================================
           DIVIDER
        ========================================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 20px;

            margin: 30px 0;

            color: #929c99;

            font-size: 14px;

        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background: rgba(255,255,255,0.18);

        }


        /* =========================================
           REGISTER
        ========================================= */

        .register {

            text-align: center;

            color: #aeb8b5;

            font-size: 14px;

        }


        .register a {

            color: #c9a15a;

            font-weight: 600;

            text-decoration: none;

            margin-left: 5px;

            transition: 0.2s;

        }


        .register a:hover {

            color: #dfbd7d;

            text-decoration: underline;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .content {

                grid-template-columns: 1fr 1fr;

                padding: 30px 5%;

            }


            .login-box {

                padding-left: 10px;

            }


            .login-title {

                font-size: 48px;

            }


            .player {

                width: 95%;

            }

        }


        @media (max-width: 800px) {

            .content {

                grid-template-columns: 1fr;

                padding: 60px 25px;

            }


            .visual {

                min-height: auto;

                height: auto;

                margin-bottom: 40px;

            }


            .player {

                width: 420px;

                max-width: 90%;

            }


            .court {

                display: none;

            }


            .login-box {

                margin: auto;

                padding-left: 0;

            }


            .bg-circle {

                width: 400px;

                height: 400px;

                left: 50%;

                transform: translateX(-50%);

            }

        }


        @media (max-width: 500px) {

            .content {

                padding: 40px 20px;

            }


            .login-title {

                font-size: 43px;

            }


            .description {

                font-size: 14px;

            }


            .input-group input {

                height: 56px;

            }


            .options {

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


    <div class="login-page">


        <!-- =====================================
             BACKGROUND DECORATION
        ====================================== -->

        <div class="bg-circle"></div>

        <div class="decor-circle"></div>

        <div class="decor-line"></div>



        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="content">


            <!-- =================================
                 LEFT SIDE
            ================================== -->

            <section class="visual">


                <div class="player">

                    <!--
                        GANTI PATH GAMBAR DI BAWAH
                        sesuai lokasi gambar kamu.

                        Contoh:
                        assets/login-player.png
                    -->

                  <img
    src="assets/pemain.png"
    alt="Pemain Badminton"
>
                </div>


                <!-- Lapangan -->

                <div class="court"></div>


            </section>



            <!-- =================================
                 RIGHT SIDE - LOGIN
            ================================== -->

            <section class="login-box">


                <!-- Small heading -->

                <div class="small-title">
                    MAINBADMINTON
                </div>



                <!-- Title -->

                <h1 class="login-title">

                    Log <span>in</span>

                </h1>



                <!-- Description -->

                <p class="description">

                    Selamat datang kembali di MainBadminton.<br>

                    Ayo lanjutkan permainanmu!

                </p>



                <!-- Error -->

                <div
                    id="errorBox"
                    class="error-box"
                ></div>



                <!-- =================================
                     LOGIN FORM
                ================================== -->

                <form id="formLogin">


                    <!-- Username / Email -->

                    <div class="input-group">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Username atau Email"
                            autocomplete="username"
                            required
                        >

                    </div>



                    <!-- Password -->

                    <div class="input-group">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >


                        <span
                            class="password-toggle"
                            onclick="togglePassword()"
                        >

                            <i
                                id="eyeIcon"
                                class="fa-regular fa-eye"
                            ></i>

                        </span>

                    </div>



                    <!-- Remember + Forgot -->

                    <div class="options">


                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe"
                            >

                            <span>
                                Ingat saya
                            </span>

                        </label>



                        <a
                            href="/forgot-password"
                            class="forgot"
                        >
                            Lupa password?
                        </a>


                    </div>



                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        Log In

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                </form>



                <!-- =================================
                     DIVIDER
                ================================== -->

                <div class="divider">
                    atau
                </div>



                <!-- =================================
                     REGISTER
                ================================== -->

                <div class="register">

                    Belum punya akun?

                    <a href="/register">
                        Daftar sekarang
                    </a>

                </div>


            </section>


        </main>


    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        /* ========================================
           SHOW / HIDE PASSWORD
        ========================================= */

        function togglePassword() {


            const password =
                document.getElementById("password");


            const eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {


                password.type = "text";


                eyeIcon.classList.remove(
                    "fa-eye"
                );


                eyeIcon.classList.add(
                    "fa-eye-slash"
                );


            } else {


                password.type = "password";


                eyeIcon.classList.remove(
                    "fa-eye-slash"
                );


                eyeIcon.classList.add(
                    "fa-eye"
                );

            }

        }



        /* ========================================
           LOGIN FORM
        ========================================= */

        document
            .getElementById("formLogin")
            .addEventListener(
                "submit",
                async function(e) {


                    e.preventDefault();



                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();



                    const password =
                        document
                            .getElementById("password")
                            .value;



                    const rememberMe =
                        document
                            .getElementById("rememberMe")
                            .checked;



                    const errorBox =
                        document
                            .getElementById("errorBox");



                    const loginButton =
                        document
                            .getElementById("loginButton");



                    /* Reset error */

                    errorBox.classList.remove(
                        "show"
                    );



                    /* Validasi */

                    if (!email || !password) {


                        errorBox.textContent =
                            "Username/email dan password wajib diisi.";


                        errorBox.classList.add(
                            "show"
                        );


                        return;

                    }



                    /* Loading */

                    loginButton.disabled = true;

                    loginButton.innerHTML =
                        `
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Loading...
                        `;



                    try {


                        /* Kirim data ke backend */

                        const response =
                            await fetch(
                                "/api/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            email:
                                                email,

                                            password:
                                                password,

                                            rememberMe:
                                                rememberMe

                                        })
                                }
                            );



                        const result =
                            await response.json();



                        /* =================================
                           LOGIN BERHASIL
                        ================================== */

                        if (result.success) {


                            localStorage.setItem(
                                "user",
                                JSON.stringify(
                                    result.user
                                )
                            );


                            window.location.href =
                                "/";


                        }


                        /* =================================
                           LOGIN GAGAL
                        ================================== */

                        else {


                            errorBox.textContent =
                                result.message ||
                                "Username atau password salah.";


                            errorBox.classList.add(
                                "show"
                            );


                        }


                    }


                    /* =================================
                       SERVER ERROR
                    ================================== */

                    catch (error) {


                        console.error(
                            "Login error:",
                            error
                        );


                        errorBox.textContent =
                            "Gagal terhubung ke server backend.";


                        errorBox.classList.add(
                            "show"
                        );


                    }


                    /* =================================
                       RESET BUTTON
                    ================================== */

                    finally {


                        loginButton.disabled = false;


                        loginButton.innerHTML =
                            `
                                Log In
                                <i class="fa-solid fa-arrow-right"></i>
                            `;

                    }


                }
            );

    </script>


</body>

</html>
